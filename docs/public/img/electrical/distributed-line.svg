<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14">
  <rect width="880" height="260" fill="#fbfbfc"/>

  <g stroke="#374151" stroke-width="2" fill="none">
    <!-- 两条导线 -->
    <path d="M60 80 H820"/>
    <path d="M60 190 H820"/>

    <!-- 串联阻抗 z -->
    <rect x="170" y="68" width="56" height="24" rx="3" fill="#eef2ff"/>
    <rect x="170" y="178" width="56" height="24" rx="3" fill="#eef2ff"/>
    <rect x="430" y="68" width="56" height="24" rx="3" fill="#eef2ff"/>
    <rect x="430" y="178" width="56" height="24" rx="3" fill="#eef2ff"/>

    <!-- 并联导纳 y -->
    <path d="M300 80 V190"/>
    <rect x="288" y="123" width="24" height="24" rx="3" fill="#fef3c7"/>
    <path d="M620 80 V190"/>
    <rect x="608" y="123" width="24" height="24" rx="3" fill="#fef3c7"/>

    <!-- 端口 -->
    <circle cx="60" cy="80" r="4" fill="#374151"/>
    <circle cx="820" cy="80" r="4" fill="#374151"/>
  </g>

  <g fill="#1f2937">
    <text x="198" y="84" text-anchor="middle" fill="#1e3a8a">z</text>
    <text x="198" y="194" text-anchor="middle" fill="#1e3a8a">z</text>
    <text x="458" y="84" text-anchor="middle" fill="#1e3a8a">z</text>
    <text x="458" y="194" text-anchor="middle" fill="#1e3a8a">z</text>
    <text x="300" y="140" text-anchor="middle" font-size="12" fill="#92400e">y</text>
    <text x="620" y="140" text-anchor="middle" font-size="12" fill="#92400e">y</text>
    <text x="48" y="72" text-anchor="end">1</text>
    <text x="832" y="72">2</text>
    <text x="70" y="212" font-size="12" fill="#6b7280">单位长度</text>
  </g>

  <!-- x 方向 -->
  <g stroke="#6b7280" stroke-width="1.5" fill="#6b7280">
    <path d="M700 230 H780"/>
    <path d="M780 230 l-10 -5 v10 z"/>
    <text x="690" y="235" text-anchor="end" font-size="12" fill="#6b7280">x</text>
  </g>
</svg>
