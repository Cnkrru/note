<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14">
  <rect width="980" height="470" fill="#fbfbfc"/>

