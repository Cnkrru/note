<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14">
  <rect width="900" height="750" fill="#fbfbfc"/>

  <!-- 短线路 -->
  <text x="24" y="34" fill="#111827" font-weight="600">短线路（&lt; 100 km）</text>
  <g stroke="#374151" stroke-width="2" fill="none">
    <circle cx="90" cy="140" r="4" fill="#374151"/>
    <path d="M90 140 H300"/>
    <rect x="300" y="122" width="120" height="36" rx="4" fill="#eef2ff"/>
    <path d="M420 140 H760"/>
    <circle cx="760" cy="140" r="4" fill="#374151"/>
  </g>
  <g fill="#1f2937">
    <text x="360" y="145" text-anchor="middle" fill="#1e3a8a">Z = R + jX</text>
    <text x="76" y="132" text-anchor="end">1</text>
    <text x="772" y="132">2</text>
  </g>

  <!-- 中等长度线路 Π 型 -->
  <text x="24" y="234" fill="#111827" font-weight="600">中等长度线路（100 ~ 300 km）：Π 型等值电路</text>
  <g stroke="#374151" stroke-width="2" fill="none">
    <circle cx="90" cy="350" r="4" fill="#374151"/>
    <path d="M90 350 H300"/>
    <rect x="300" y="332" width="120" height="36" rx="4" fill="#eef2ff"/>
    <path d="M420 350 H760"/>
    <circle cx="760" cy="350" r="4" fill="#374151"/>
    <path d="M170 350 V400"/>
    <rect x="146" y="400" width="48" height="26" rx="4" fill="#fef3c7"/>
    <path d="M170 426 V444"/>
    <path d="M140 444 H200 M152 452 H188 M164 460 H176"/>
    <path d="M620 350 V400"/>
    <rect x="596" y="400" width="48" height="26" rx="4" fill="#fef3c7"/>
    <path d="M620 426 V444"/>
    <path d="M590 444 H650 M602 452 H638 M614 460 H626"/>
  </g>
  <g fill="#1f2937">
    <text x="360" y="355" text-anchor="middle" fill="#1e3a8a">Z = R + jX</text>
    <text x="170" y="419" text-anchor="middle" font-size="12" fill="#92400e">Y/2</text>
    <text x="620" y="419" text-anchor="middle" font-size="12" fill="#92400e">Y/2</text>
    <text x="76" y="342" text-anchor="end">1</text>
    <text x="772" y="342">2</text>
  </g>

  <!-- 长线路 T 型 -->
  <text x="24" y="530" fill="#111827" font-weight="600">长线路（&gt; 300 km）：T 型等值电路</text>
  <g stroke="#374151" stroke-width="2" fill="none">
    <circle cx="90" cy="630" r="4" fill="#374151"/>
    <path d="M90 630 H200"/>
    <rect x="200" y="612" width="80" height="36" rx="4" fill="#eef2ff"/>
    <path d="M280 630 H520"/>
    <rect x="520" y="612" width="80" height="36" rx="4" fill="#eef2ff"/>
    <path d="M600 630 H760"/>
    <circle cx="760" cy="630" r="4" fill="#374151"/>
    <!-- 中间并联支路 -->
    <path d="M400 630 V654"/>
    <rect x="376" y="654" width="48" height="26" rx="4" fill="#fef3c7"/>
    <path d="M400 680 V696"/>
    <path d="M370 696 H430 M382 704 H418 M394 712 H406"/>
  </g>
  <g fill="#1f2937">
    <text x="240" y="635" text-anchor="middle" font-size="12" fill="#1e3a8a">Z/2</text>
    <text x="560" y="635" text-anchor="middle" font-size="12" fill="#1e3a8a">Z/2</text>
    <text x="400" y="673" text-anchor="middle" font-size="12" fill="#92400e">Y</text>
    <text x="76" y="622" text-anchor="end">1</text>
    <text x="772" y="622">2</text>
  </g>
</svg>
